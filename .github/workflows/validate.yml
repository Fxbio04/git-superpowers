name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin structure
        run: python3 scripts/validate.py
      - name: Test git-guard hook
        run: bash hooks/test-git-guard.sh
